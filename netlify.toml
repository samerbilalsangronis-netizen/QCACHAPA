[build]
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
  [headers.values]
  Content-Security-Policy = "default-src 'self'; img-src 'self' https: data: blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
  Referrer-Policy = "strict-origin"
  X-Content-Type-Options = "nosniff"

[[headers]]
for = "/sw.js"
  [headers.values]
  Cache-Control = "no-cache"
